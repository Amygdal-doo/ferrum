# Publishes a Ferrum app release when a tag `<app-id>-v<semver>` is pushed,
# e.g. `api-v0.2.0`. Ferrum Launcher reads these releases.
#
# Assets per target, each with a `<same>.sha256`.
# Read by Ferrum Launcher:
#   <app-id>-<version>-<target>.tar.gz      macOS/Linux: binaries at the root
#   <app-id>-<version>-<target>.app.tar.gz  macOS: the .app bundle
#   <app-id>-<version>-<target>.zip         Windows: .exe files and <app-id>.ico
# Installers for people downloading by hand (launcher only; the other apps
# are installed through the launcher):
#   <AppName>-<version>-<arch>.dmg          macOS disk image
#   <package>_<version>_amd64.deb           Debian/Ubuntu package
#   <AppName>-<version>-x86_64-setup.exe    Windows per-user installer (Inno Setup)
# FerrumTerm has no Windows build (its server uses Unix sockets).
#
# Releases are published to the public, releases-only repo $RELEASE_REPO
# (customers and Ferrum Launcher download from it without signing in), not to
# this private source repo.
#
# `toolbox-v*` releases (the bridge for Ferrum Toolbox 0.5.0) are not built
# here: scripts/package-bridge.sh makes them from a launcher release (see
# launcher/README.md).
#
# Secrets:
#   RELEASES_TOKEN   A token with Contents: write on $RELEASE_REPO.
#   SUBMODULE_TOKEN  A token with read access to Amygdal-doo/ferrum-ide (the
#                    repo behind the ide/ submodule). Every app needs it checked
#                    out, because the apps depend on its GPUI crates by path.
#                    It is only a library; nothing is released from it.
name: Release

on:
  push:
    tags: ["*-v*"]

permissions:
  contents: read

env:
  RELEASE_REPO: Amygdal-doo/ferrum-releases

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.parse.outputs.app }}
      version: ${{ steps.parse.outputs.version }}
      package: ${{ steps.parse.outputs.package }}
      binaries: ${{ steps.parse.outputs.binaries }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: parse
        name: Parse tag
        run: |
          tag="${GITHUB_REF_NAME}"
          app="${tag%%-v*}"
          version="${tag#*-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$version' is not a semver version"; exit 1
          fi
          case "$app" in
            api)     package=ferrumapi-desktop;     binaries="ferrumapi" ;;
            git)     package=ferrumgit-desktop;     binaries="ferrumgit" ;;
            data)    package=ferrumdata-desktop;    binaries="ferrumdata" ;;
            term)    package="ferrumterm-gui ferrumterm-cli"; binaries="ferrumterm fterm" ;;
            kit)     package=ferrumkit-desktop;     binaries="ferrumkit" ;;
            dock)    package="ferrumdock-desktop ferrumdock-cli"; binaries="ferrumdock ferrumdock-cli" ;;
            editor)  package=ferrumeditor-desktop;  binaries="ferrumeditor" ;;
            vibe) package=ferrumvibe-desktop; binaries="ferrumvibe" ;;
            system) package=ferrumsystem-desktop; binaries="ferrumsystem" ;;
            ports)   package=ferrumports-desktop;   binaries="ferrumports" ;;
            env)     package=ferrumenv-desktop;     binaries="ferrumenv" ;;
            launcher) package=ferrumlauncher-desktop; binaries="ferrum-launcher" ;;
            toolbox) echo "::error::toolbox-v* is the Ferrum Toolbox 0.5.0 bridge; build it with scripts/package-bridge.sh"; exit 1 ;;
            ide) echo "::error::Ferrum IDE is no longer released; Ferrum Editor (editor-v*) is the suite's code editor"; exit 1 ;;
            *) echo "::error::unknown app id '$app'"; exit 1 ;;
          esac
          {
            echo "app=$app"
            echo "version=$version"
            echo "package=$package"
            echo "binaries=$binaries"
          } >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          notes="$(git tag -l --format='%(contents)' "$tag")"
          prerelease=""
          [[ "${{ steps.parse.outputs.version }}" == *-* ]] && prerelease="--prerelease"
          [ -n "$notes" ] || notes="$tag"
          if gh release view "$tag" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            echo "Release $tag exists; assets will be replaced."
          else
            gh release create "$tag" --repo "$RELEASE_REPO" --target main \
              --title "$tag" --notes "$notes" $prerelease
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-13
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      APP: ${{ needs.prepare.outputs.app }}
      VERSION: ${{ needs.prepare.outputs.version }}
      PACKAGE: ${{ needs.prepare.outputs.package }}
      BINARIES: ${{ needs.prepare.outputs.binaries }}
      # Developer ID signing + notarization run only when these secrets exist;
      # without them macOS builds are ad-hoc signed (Gatekeeper warns).
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.NOTARY_API_KEY != '' }}
    steps:
      - name: Check platform support
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ "$APP" = "term" ]; then
            echo "FerrumTerm has no Windows build yet; skipping."
            echo "FERRUM_SKIP=true" >> "$GITHUB_ENV"
          fi
          if [ "${{ runner.os }}" = "Windows" ] && [ "$APP" = "vibe" ]; then
            echo "FerrumVibe embeds FerrumTerm and has no Windows build yet; skipping."
            echo "FERRUM_SKIP=true" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.FERRUM_SKIP != 'true'
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}
      - name: Linux dependencies
        if: env.FERRUM_SKIP != 'true' && runner.os == 'Linux'
        run: |
          ide/script/linux
          sudo apt-get install -y dpkg-dev
      - name: License check (no GPL-family crates in shipped binaries)
        if: env.FERRUM_SKIP != 'true' && runner.os == 'Linux'
        run: scripts/check-licenses.sh
      - name: Build
        if: env.FERRUM_SKIP != 'true'
        run: |
          rustup target add "${{ matrix.target }}"
          args=()
          for package in $PACKAGE; do args+=(-p "$package"); done
          # Read by ferrumlauncher_core::platform::running_version.
          FERRUM_VERSION="$VERSION" cargo build --release --locked --target "${{ matrix.target }}" "${args[@]}"
          target_dir="$PWD/target/${{ matrix.target }}/release"
          if [ "${{ runner.os }}" = "Windows" ]; then
            target_dir="$(cygpath -w "$target_dir")"
          fi
          echo "TARGET_DIR=$target_dir" >> "$GITHUB_ENV"
      - name: Import Developer ID certificate (macOS)
        if: env.FERRUM_SKIP != 'true' && runner.os == 'macOS' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/ferrum-signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          [ -n "$identity" ] || { echo "::error::no Developer ID Application identity in MACOS_CERTIFICATE_P12"; exit 1; }
          printf '%s' "$NOTARY_API_KEY" > "$RUNNER_TEMP/notary-key.p8"
          {
            echo "FERRUM_SIGN_IDENTITY=$identity"
            echo "FERRUM_NOTARY_KEY=$RUNNER_TEMP/notary-key.p8"
            echo "FERRUM_NOTARY_KEY_ID=$NOTARY_API_KEY_ID"
            echo "FERRUM_NOTARY_ISSUER=$NOTARY_API_ISSUER"
          } >> "$GITHUB_ENV"
      - name: Package (macOS, Linux)
        if: env.FERRUM_SKIP != 'true' && runner.os != 'Windows'
        run: |
          . scripts/lib/apps.sh
          ferrum_app "$APP"
          assets=()
          checksum() {
            if command -v sha256sum >/dev/null; then sha256sum "$1" > "$1.sha256"; else shasum -a 256 "$1" > "$1.sha256"; fi
            assets+=("$1" "$1.sha256")
          }

          # Plain archive: binaries at the root (Linux, CLI use, older launchers).
          name="${APP}-${VERSION}-${{ matrix.target }}.tar.gz"
          staging="$(mktemp -d)"
          for binary in $BINARIES; do
            cp "$TARGET_DIR/$binary" "$staging/"
          done
          tar -C "$staging" -czf "$name" .
          checksum "$name"

          if [ "${{ runner.os }}" = "macOS" ]; then
            # .app bundle archive: preferred by Ferrum Launcher on macOS.
            bundles="$(mktemp -d)"
            bundle="$(scripts/bundle-macos.sh "$APP" "$VERSION" "${{ matrix.target }}" "$TARGET_DIR" "$bundles")"
            if [ -n "${FERRUM_NOTARY_KEY:-}" ]; then
              scripts/notarize-macos.sh "$bundle"
            fi
            app_archive="${APP}-${VERSION}-${{ matrix.target }}.app.tar.gz"
            tar -C "$bundles" -czf "$app_archive" "$(basename "$bundle")"
            checksum "$app_archive"

            # Every app gets a disk image for installing it by hand; the
            # launcher installs from the archives above.
            arch="${{ matrix.target }}"
            arch="${arch%%-*}"
            dmg="${APP_FILE_NAME}-${VERSION}-${arch}.dmg"
            scripts/make-dmg.sh "$bundle" "$dmg" "$APP_NAME"
            if [ -n "${FERRUM_NOTARY_KEY:-}" ]; then
              scripts/notarize-macos.sh "$dmg"
            fi
            checksum "$dmg"
          else
            deb="$(scripts/package-deb.sh "$APP" "$VERSION" "$TARGET_DIR" .)"
            checksum "$(basename "$deb")"
          fi

          printf '%s\n' "${assets[@]}" > assets.txt
      - name: Package (Windows)
        if: env.FERRUM_SKIP != 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Only the launcher gets a setup.exe; the other apps install from the zip.
          $installer = @{}
          if ($env:APP -ne "launcher") { $installer.SkipInstaller = $true }
          $files = & ./scripts/package-windows.ps1 -App $env:APP -Version $env:VERSION `
            -BinaryDir $env:TARGET_DIR -OutDir . -Target "${{ matrix.target }}" @installer
          $assets = @()
          foreach ($file in $files) {
            $name = Split-Path -Leaf $file
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLower()
            Set-Content -NoNewline -Path "$name.sha256" -Value "$hash  $name`n"
            $assets += $name, "$name.sha256"
          }
          Set-Content -Path assets.txt -Value $assets
      - name: Upload
        if: env.FERRUM_SKIP != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          # macOS runners ship bash 3.2 (no mapfile); strip CRs from the Windows list.
          tr -d '\r' < assets.txt | tr '\n' '\0' | xargs -0 gh release upload "${GITHUB_REF_NAME}" --repo "$RELEASE_REPO" --clobber
