[alias]
brand = "run -p ferrum-brand --"
api = "run -p ferrumapi-desktop"
git-ui = "run -p ferrumgit-desktop"
desktop = "run -p ferrumdata-desktop"
term = "run -p ferrumterm-gui"
fterm = "run -p ferrumterm-cli --"
kit = "run -p ferrumkit-desktop"
dock = "run -p ferrumdock-desktop"
launcher = "run -p ferrumlauncher-desktop"
editor = "run -p ferrumeditor-desktop"
ports = "run -p ferrumports-desktop"
env-ui = "run -p ferrumenv-desktop"
lint = "clippy --workspace --all-targets -- -D warnings"

[env]
MACOSX_DEPLOYMENT_TARGET = "10.15.7"
