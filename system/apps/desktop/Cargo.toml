[package]
name = "ferrumsystem-desktop"
description = "Ferrum System (FeS) — system architecture diagrams with layers, flows, data and live pods, GPUI desktop shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrumsystem"
path = "src/main.rs"

[dependencies]
ferrumsystem-core.workspace = true
ferrum-ui.workspace = true
gpui.workspace = true

[dev-dependencies]
# Headless GPUI test harness (TestAppContext); no window is shown.
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
