[package]
name = "ferrumsystem-desktop"
description = "FerrumSystem (FeS) — system architecture diagrams with layers, flows, data and live pods, GPUI desktop shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "ferrumsystem"
path = "src/main.rs"

[dependencies]
ferrumsystem-core.workspace = true
ferrum-ui.workspace = true
# The Ferrum account: Sign in / avatar menu, Settings › Account.
ferrum-account-ui.workspace = true
gpui.workspace = true
serde.workspace = true
# FerrumChat in the Agent pane, with the diagram tools.
ferrumagent-ui.workspace = true
async-trait.workspace = true
# The agent's edit tools call the window over a channel.
futures.workspace = true
serde_json.workspace = true
# Export: the diagram's SVG rendered to PNG (with text in the system fonts).
resvg = { workspace = true, features = ["text", "system-fonts"] }

[dev-dependencies]
# Headless GPUI test harness (TestAppContext); no window is shown.
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
