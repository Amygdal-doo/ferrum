[package]
name = "ferrumterm-ui"
description = "FerrumTerm's terminal UI as an embeddable GPUI view (tabs, splits, agents and SSH sidebar, dialogs)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ferrumterm-protocol.workspace = true
ferrumterm-client.workspace = true
# The default palette, mapped onto the colour themes.
ferrumterm-emulator.workspace = true
ferrumterm-net.workspace = true
# Private in-process server when the shared one can't be reached or started.
ferrumterm-server.workspace = true
ferrum-ui.workspace = true
# The Ferrum account control in the stand-alone window's header.
ferrum-account-ui.workspace = true
# FerrumGIT beside the terminal (the pane header's FerrumGIT / Changes toggles).
ferrumgit-ui.workspace = true
# FerrumChat beside the terminal (the desktop window's Agent pane), with
# the terminal tools.
ferrumagent-ui.workspace = true
async-trait.workspace = true
# Named for `gpui::actions!` (which refers to `gpui::…` paths).
gpui.workspace = true
futures.workspace = true
unicode-width.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
# ~/.ferrum/term/config.toml.
toml.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Which Option key is down (Settings › Keyboard › Option key: left / right),
# and the system alert sound (Settings › Terminal › Bell).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSGraphics"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
