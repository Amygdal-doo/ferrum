[package]
name = "ferrumlauncher-core"
description = "FerrumLauncher core: app catalog, GitHub Releases client, installer, local version store and migration from Ferrum Toolbox."
# Release builds take their version from the `launcher-v<semver>` tag (FERRUM_VERSION).
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Shell commands and ~/.ferrum/preferences.json, shared with every app.
ferrum-shell = { path = "../../../shared/shell" }
chrono.workspace = true
directories.workspace = true
flate2.workspace = true
futures.workspace = true
keyring.workspace = true
reqwest = { workspace = true, features = ["rustls", "json", "stream"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process"] }
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
