[package]
name = "ferrumlauncher-desktop"
description = "Ferrum Launcher: installs, updates and launches the Ferrum apps (GPUI)."
# Release builds take their version from the `launcher-v<semver>` tag (FERRUM_VERSION).
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrum-launcher"
path = "src/main.rs"

[dependencies]
ferrumlauncher-core.workspace = true
ferrum-ui.workspace = true
chrono.workspace = true
semver.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures.workspace = true

# Menu bar icon and global shortcuts (macOS).
[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.21", default-features = false }
global-hotkey = "0.7"
png = "0.17"

[lints]
workspace = true
