[package]
name = "ferrumlauncher-desktop"
description = "Ferrum Launcher: installs, updates and launches the Ferrum apps (GPUI)."
# Release builds take their version from the `launcher-v<semver>` tag (FERRUM_VERSION).
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrum-launcher"
path = "src/main.rs"

[dependencies]
ferrumlauncher-core.workspace = true
ferrum-ui.workspace = true
chrono.workspace = true
semver.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
