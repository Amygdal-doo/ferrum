# Local databases for development and integration tests.
#   docker compose up -d postgres
#   FERRUM_TEST_PG=1 cargo test -p ferrum-db-postgres --test postgres
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ferrum
      POSTGRES_PASSWORD: ferrum-dev-password
      POSTGRES_DB: ferrum_test
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferrum -d ferrum_test"]
      interval: 2s
      retries: 30
