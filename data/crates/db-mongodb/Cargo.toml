[package]
name = "ferrumdata-db-mongodb"
description = "MongoDB adapter (official driver, JSON command input)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ferrumdata-domain.workspace = true
ferrumdata-db-driver-api.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde_json.workspace = true
chrono.workspace = true
mongodb = { workspace = true, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
# Same crate as `mongodb::bson`; named directly for the extended-JSON conversions.
bson.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
