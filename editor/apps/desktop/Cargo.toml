[package]
name = "ferrumeditor-desktop"
description = "Ferrum Editor — a small, hackable text editor. GPUI desktop shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrumeditor"
path = "src/main.rs"

[dependencies]
ferrumeditor-core.workspace = true
ferrum-ui.workspace = true
gpui.workspace = true
ui.workspace = true
theme.workspace = true
menu.workspace = true
anyhow.workspace = true
notify.workspace = true
trash.workspace = true
# Integrated terminal: FerrumTerm's emulator + a local PTY.
ferrumterm-emulator.workspace = true
ferrumterm-protocol.workspace = true
portable-pty.workspace = true
futures.workspace = true
serde_json.workspace = true
# Git panel and view: FerrumGIT's git layer (runs on a small tokio runtime).
ferrumgit-git.workspace = true
ferrumgit-domain.workspace = true
tokio.workspace = true
unicode-width.workspace = true
# CI page: GitHub Actions through ferrumci-core on FerrumGIT's forge client.
ferrumci-core.workspace = true
ferrumgit-forge.workspace = true
chrono.workspace = true
tracing.workspace = true
# Logs page: log sources, parsing and filtering from ferrumlogs-core.
ferrumlogs-core.workspace = true


[dev-dependencies]
# Headless GPUI test harness (TestAppContext); no window is shown.
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
async-trait.workspace = true

[lints]
workspace = true
