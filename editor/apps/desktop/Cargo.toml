[package]
name = "ferrumeditor-desktop"
description = "Ferrum Editor — a small, hackable text editor. GPUI desktop shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrumeditor"
path = "src/main.rs"

[dependencies]
ferrumeditor-core.workspace = true
ferrum-ui.workspace = true
gpui.workspace = true
anyhow.workspace = true
notify.workspace = true
trash.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true
# Tool panes inside the window: FerrumGIT, FerrumTerm and FerrumChat as
# embedded views (split panes next to the editor).
ferrumgit-ui.workspace = true
ferrumterm-ui.workspace = true
ferrumagent-ui.workspace = true
# CI page: GitHub Actions through ferrumci-core on FerrumGIT's forge client.
ferrumci-core.workspace = true
ferrumgit-forge.workspace = true
chrono.workspace = true
tracing.workspace = true
# Logs page: log sources, parsing and filtering from ferrumlogs-core.
ferrumlogs-core.workspace = true


[dev-dependencies]
# Headless GPUI test harness (TestAppContext); no window is shown.
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
async-trait.workspace = true
# Tokens for the CI tests' fake forge.
ferrumgit-domain.workspace = true

[lints]
workspace = true
