<!DOCTYPE html>
<!-- Social image template (1200x630). render.sh fills the {{…}} fields. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Hanken+Grotesk:wght@500;600&display=block">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; box-sizing: border-box; padding: 72px 80px;
    background: radial-gradient(60% 90% at 100% 0%, color-mix(in srgb, {{ACCENT}} 22%, transparent), transparent 70%), #0d1520;
    color: #eaf0f5; font-family: "Hanken Grotesk", sans-serif;
    display: grid; grid-template-columns: 1fr 300px; gap: 56px; align-items: center;
  }
  body::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 10px;
    background: linear-gradient(90deg, {{ACCENT}}, color-mix(in srgb, {{ACCENT}} 15%, #0d1520) 75%); }
  .brand { display: flex; align-items: center; gap: 14px; font: 800 34px/1 "Big Shoulders Display", sans-serif; color: #9db0c3; margin-bottom: 40px; }
  .brand img { width: 44px; height: 44px; }
  h1 { margin: 0 0 18px; font: 800 {{SIZE}}px/0.9 "Big Shoulders Display", sans-serif; letter-spacing: -0.005em; }
  .kind { margin: 0 0 22px; font-size: 30px; font-weight: 600; color: {{ACCENT}}; }
  .tagline { margin: 0; font-size: 30px; line-height: 1.3; color: #c7d3df; max-width: 24ch; }
  .logo { width: 300px; height: 300px; filter: drop-shadow(0 24px 60px color-mix(in srgb, {{ACCENT}} 45%, transparent)); }
</style>
</head>
<body>
  <div>
    <div class="brand"><img src="{{MARK}}" alt="">Ferrum</div>
    <h1>{{NAME}}</h1>
    <p class="kind">{{KIND}} for macOS</p>
    <p class="tagline">{{TAGLINE}}</p>
  </div>
  <img class="logo" src="{{LOGO}}" alt="">
</body>
</html>
