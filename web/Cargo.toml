[package]
name = "web-ferrum"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Marketing site for the Ferrum family of Rust developer tools."

[dependencies]
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["compression-gzip", "compression-br", "trace", "set-header"] }
rust-embed = "8.13"
mime_guess = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
