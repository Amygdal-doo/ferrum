[package]
name = "ferrum-account"
description = "Ferrum account sign-in for the desktop apps: loopback OAuth with PKCE, keychain-stored refresh tokens, ~/.ferrum/account.json and single sign-on from FerrumLauncher."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
keyring.workspace = true
reqwest = { workspace = true, features = ["rustls", "json"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "time", "process", "rt"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }

[lints]
workspace = true
