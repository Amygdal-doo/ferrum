[package]
name = "ferrum-ui"
description = "Shared GPUI shell, theme bootstrap and widgets for the Ferrum desktop tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
path = "src/ferrum_ui.rs"

[dependencies]
anyhow.workspace = true
# Settings › System: the app's shell command and Dock choice.
ferrum-shell = { path = "../shell" }
gpui.workspace = true
# Same platform features as the IDE; without `font-kit` macOS renders no text.
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Dock icon visibility (NSApplication activation policy) and the menu bar
# extra of an app hidden from the Dock, safe bindings.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSDockTile", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSRunningApplication", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle", "NSError", "NSGeometry", "NSArray", "NSObject"] }
# Asking for notification permission and posting as the app itself (so it is
# listed in System Settings › Notifications).
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "block2", "bitflags", "UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationTrigger"] }
block2 = "0.6"

[lints]
workspace = true
