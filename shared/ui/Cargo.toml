[package]
name = "ferrum-ui"
description = "Shared GPUI shell, theme bootstrap and widgets for the Ferrum desktop tools."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/ferrum_ui.rs"

[dependencies]
anyhow.workspace = true
assets.workspace = true
gpui.workspace = true
# Same platform features as the IDE; without `font-kit` macOS renders no text.
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
menu.workspace = true
smallvec.workspace = true
theme.workspace = true
ui.workspace = true
unicode-segmentation.workspace = true
# Enables `debug-embed` for `assets` (see root Cargo.toml).
util.workspace = true

[lints]
workspace = true
