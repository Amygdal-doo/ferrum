[package]
name = "ferrumapi-desktop"
description = "FerrumAPI HTTP client — GPUI desktop shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrumapi"
path = "src/main.rs"

[dependencies]
ferrumapi-domain.workspace = true
ferrumapi-application.workspace = true
ferrum-ui.workspace = true
gpui.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true
uuid.workspace = true
rfd.workspace = true
chrono.workspace = true
base64.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Headless GPUI test harness (TestAppContext); no window is shown.
gpui = { workspace = true, features = ["test-support"] }
