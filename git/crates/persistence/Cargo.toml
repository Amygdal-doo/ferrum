[package]
name = "ferrumgit-persistence"
description = "Local application state: repositories, profiles, workspace, settings (SQLite)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ferrumgit-domain.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
