[package]
name = "ferrumgit-ui"
description = "FerrumGIT's full GPUI interface as an embeddable view (GitView), shared by the FerrumGIT app and other Ferrum hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
ferrumgit-domain.workspace = true
ferrumgit-application.workspace = true
ferrum-ui.workspace = true
# The Ferrum account control in the stand-alone app's header.
ferrum-account-ui.workspace = true
# The stand-alone app's file editor: FerrumIDE's buffer, undo, highlighting.
ferrumeditor-core.workspace = true
gpui.workspace = true
tracing.workspace = true
directories.workspace = true
chrono.workspace = true
# Folders without git: watching them and diffing against a snapshot.
notify.workspace = true
similar.workspace = true
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# A scripted model for the AI draft tests.
ferrumagent-core.workspace = true
tempfile.workspace = true

[lints]
workspace = true
