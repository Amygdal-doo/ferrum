[package]
name = "ferrumenv-cli"
description = "fenv: FerrumVariables from the terminal. Runs a command with a project's variables injected (no .env file written) and lists variable names."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "fenv"
path = "src/main.rs"

[dependencies]
ferrumenv-core.workspace = true
clap.workspace = true
crossterm.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
