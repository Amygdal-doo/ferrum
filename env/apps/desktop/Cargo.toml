[package]
name = "ferrumenv-desktop"
description = "FerrumVariables: a password-locked vault for project environment variables. GPUI desktop shell."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "ferrumenv"
path = "src/main.rs"

[dependencies]
ferrumenv-core.workspace = true
chrono.workspace = true
ferrum-ui.workspace = true
gpui.workspace = true
sha2.workspace = true
zeroize.workspace = true

[dev-dependencies]
# Headless GPUI test harness (TestAppContext); no window is shown.
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true
