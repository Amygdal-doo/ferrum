[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates
ferrum-domain = { path = "crates/domain" }
ferrum-db-driver-api = { path = "crates/db-driver-api" }
ferrum-db-postgres = { path = "crates/db-postgres" }
ferrum-persistence = { path = "crates/persistence" }
ferrum-credentials = { path = "crates/credentials" }
ferrum-application = { path = "crates/application" }
ferrum-result-grid-core = { path = "crates/result-grid-core" }
ferrum-editor-core = { path = "crates/editor-core" }

# UI — pinned exactly; Rust/UI components are vendored against this version (ADR-002).
dioxus = { version = "=0.7.10", default-features = false }
tw_merge = "0.1"

# Async
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
futures = "0.3.34"
async-trait = "0.1.92"

# Database
sqlx = { version = "0.9.0", default-features = false }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.28", features = ["v4", "serde"] }
thiserror = "2.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
keyring = "4.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
