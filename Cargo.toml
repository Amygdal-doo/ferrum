# Ferrum monorepo — one Cargo workspace for the Ferrum desktop tools.
#
# The apps depend on GPUI (Apache-2.0) from upstream Zed as a pinned git
# dependency (see `[workspace.dependencies]`). Widgets, theme, icons and fonts
# come from `shared/ui` (ferrum-ui).
# `web/` is a standalone package (own Dockerfile / Railway build context).
[workspace]
resolver = "3"
members = [
    "shared/*",
    "brand/render",
    "api/apps/*",
    "api/crates/*",
    "git/apps/*",
    "git/crates/*",
    "data/apps/*",
    "data/crates/*",
    "term/apps/*",
    "term/crates/*",
    "launcher/apps/*",
    "launcher/crates/*",
    "dock/apps/*",
    "dock/crates/*",
    "kit/apps/*",
    "kit/crates/*",
    "editor/apps/*",
    "editor/crates/*",
    "ports/apps/*",
    "ports/crates/*",
    "system/apps/*",
    "system/crates/*",
    "env/apps/*",
    "env/crates/*",
    "logs/crates/*",
    "ci/crates/*",
    "agent/crates/*",
    "vibe/apps/*",
]
exclude = ["web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Shared
resvg = { version = "0.46", default-features = false }
# Already built for GPUI; FerrumIDE's image viewer checks images with it.
image = { version = "0.25", default-features = false }
ferrum-ui = { path = "shared/ui" }
ferrum-account = { path = "shared/account" }
ferrum-account-ui = { path = "shared/account-ui" }

# GPUI (Apache-2.0) from upstream Zed, pinned to one commit and used as a
# library only. Only permissively licensed Zed crates may be added here; Zed's
# GPL-3.0 / AGPL-3.0 crates must stay out (see scripts/check-licenses.sh).
# When bumping `rev`, re-sync `[patch.crates-io]` below with Zed's Cargo.toml.
gpui = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "03efd49220ba06703d04f9c4732fdf814f9c523c" }

# FerrumAPI
ferrumapi-domain = { path = "api/crates/domain" }
ferrumapi-http = { path = "api/crates/http" }
ferrumapi-persistence = { path = "api/crates/persistence" }
ferrumapi-interop = { path = "api/crates/interop" }
ferrumapi-application = { path = "api/crates/application" }
ferrumapi-server = { path = "api/crates/server" }
ferrumapi-grpc = { path = "api/crates/grpc" }

# FerrumGIT
ferrumgit-domain = { path = "git/crates/domain" }
ferrumgit-git = { path = "git/crates/git" }
ferrumgit-graph = { path = "git/crates/graph" }
ferrumgit-persistence = { path = "git/crates/persistence" }
ferrumgit-credentials = { path = "git/crates/credentials" }
ferrumgit-forge = { path = "git/crates/forge" }
ferrumgit-application = { path = "git/crates/application" }
ferrumgit-ui = { path = "git/crates/ui" }

# FerrumData
ferrumdata-domain = { path = "data/crates/domain" }
ferrumdata-db-driver-api = { path = "data/crates/db-driver-api" }
ferrumdata-db-postgres = { path = "data/crates/db-postgres" }
ferrumdata-db-mysql = { path = "data/crates/db-mysql" }
ferrumdata-db-sqlite = { path = "data/crates/db-sqlite" }
ferrumdata-db-surrealdb = { path = "data/crates/db-surrealdb" }
ferrumdata-db-mongodb = { path = "data/crates/db-mongodb" }
ferrumdata-db-redis = { path = "data/crates/db-redis" }
ferrumdata-persistence = { path = "data/crates/persistence" }
ferrumdata-credentials = { path = "data/crates/credentials" }
ferrumdata-application = { path = "data/crates/application" }
ferrumdata-result-grid-core = { path = "data/crates/result-grid-core" }
ferrumdata-editor-core = { path = "data/crates/editor-core" }

# FerrumTerm
ferrumterm-protocol = { path = "term/crates/protocol" }
ferrumterm-emulator = { path = "term/crates/emulator" }
ferrumterm-server = { path = "term/crates/server" }
ferrumterm-client = { path = "term/crates/client" }
ferrumterm-net = { path = "term/crates/net" }
ferrumterm-ui = { path = "term/crates/ui" }

# FerrumLauncher
ferrumlauncher-core = { path = "launcher/crates/core" }

# FerrumContainers
ferrumdock-engine = { path = "dock/crates/engine" }
# Docker Engine API client (Unix socket + TCP; no TLS features).
bollard = { version = "0.21", default-features = false, features = ["http", "pipe"] }

# FerrumKit
ferrumkit-core = { path = "kit/crates/core" }

# FerrumPorts
ferrumports-core = { path = "ports/crates/core" }

# FerrumSystem (FeS)
ferrumsystem-core = { path = "system/crates/core" }

# FerrumVariables
ferrumenv-core = { path = "env/crates/core" }
# Vault encryption: XChaCha20-Poly1305 with an Argon2id-derived key.
chacha20poly1305 = { version = "0.10", features = ["std"] }
argon2 = { version = "0.5", features = ["std"] }
# Team members' keys: X25519 and HKDF-SHA256. Already linked into every app
# through rustls (ISC / Apache-2.0), so no new code is shipped.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys"] }
zeroize = { version = "1.8", features = ["derive"] }

# Logs (library behind the Editor's Logs page)
ferrumlogs-core = { path = "logs/crates/core" }

# CI (library behind the Editor's CI page)
ferrumci-core = { path = "ci/crates/core" }

# FerrumChat (agentic coding chat: core + GPUI view)
ferrumagent-core = { path = "agent/crates/core" }
ferrumagent-ui = { path = "agent/crates/ui" }
# Rule globs (`.cursor/rules/*.mdc`); already in the graph through `ignore`.
globset = "0.4"

# FerrumIDE
ferrumeditor-core = { path = "editor/crates/core" }
# Text buffer, file walking/watching, Trash, and tree-sitter highlighting.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
ignore = "0.4"
notify = "8"
trash = "5.2"
tree-sitter = "0.25"
tree-sitter-highlight = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.5"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"

# Terminal
alacritty_terminal = "0.25"
portable-pty = "0.9"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29"
unicode-width = "0.2"

# Desktop
rfd = "0.17"

# Async
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "process", "signal"] }
tokio-util = "0.7.20"
futures = "0.3.34"
async-trait = "0.1.92"

# HTTP
reqwest = { version = "0.13", default-features = false }
url = "2.5"
base64 = "0.22"
percent-encoding = "2.3"
mime_guess = "2.0"
# Local HTTP servers (FerrumAPI mock server / webhook inspector)
hyper = { version = "1.6", default-features = false }
hyper-util = { version = "0.1", default-features = false }
http-body-util = "0.1"
bytes = "1"

# Database
sqlx = { version = "0.9.0", default-features = false }
# Remote clients only: no embedded storage engines (FerrumData never hosts a DB).
surrealdb = { version = "4.0", default-features = false }
mongodb = { version = "3.10", default-features = false }
bson = { version = "3.1", features = ["serde", "serde_json-1"] }
# Redis/Valkey client (FerrumData): async over Tokio, TLS via rustls.
redis = { version = "1.2", default-features = false }
# Named only to install a rustls crypto provider (several are compiled into the workspace).
rustls = { version = "0.23", default-features = false }

# Utilities
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
thiserror = "2.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
keyring = "4.2"
tempfile = "3"
getrandom = "0.3"
semver = { version = "1.0", features = ["serde"] }
sha2 = "0.10"
flate2 = "1.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
tar = "0.4"
unicode-segmentation = "1.10"
smallvec = { version = "1.6", features = ["union", "const_new"] }
# FerrumKit tools (same versions as Zed where it uses them)
regex = "1.12"
similar = "2.7"
serde_yaml_ng = "0.10"
toml = "0.9"
md-5 = "0.10"
sha1 = "0.10"
# FerrumAPI request signing (OAuth 1 HMAC-SHA1, AWS SigV4)
hmac = "0.12"
ulid = "1.2"
# FerrumAPI protocols: WSDL / OData $metadata parsing, WebSocket, gRPC
roxmltree = "0.21"
tokio-tungstenite = { version = "0.29", default-features = false }
rustls-platform-verifier = "0.7"
tonic = { version = "0.14", default-features = false }
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
prost-reflect = "0.16"
protox = "0.9"
tokio-rustls = { version = "0.26", default-features = false }
tower = "0.5"


[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# GPUI is unusably slow unoptimized; keep our code fast to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1

# Mirrors the `[patch.crates-io]` of Zed's Cargo.toml at the pinned `rev`:
# GPUI relies on Zed's forks of these crates (a git dependency's own patches
# are not applied to this workspace).
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
