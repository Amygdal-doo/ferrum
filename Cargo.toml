[workspace]
resolver = "3"
members = ["apps/desktop", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates
ferrumapi-domain = { path = "crates/domain" }
ferrumapi-http = { path = "crates/http" }
ferrumapi-persistence = { path = "crates/persistence" }
ferrumapi-interop = { path = "crates/interop" }
ferrumapi-application = { path = "crates/application" }

# UI — pinned exactly; Rust/UI components are vendored against this version (same as FerrumData).
dioxus = { version = "=0.7.10", default-features = false }
tw_merge = "0.1"
rfd = "0.17"

# Async
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
futures = "0.3.34"

# HTTP
reqwest = { version = "0.13", default-features = false }
url = "2.5"
base64 = "0.22"
percent-encoding = "2.3"
mime_guess = "2.0"

# Database
sqlx = { version = "0.9.0", default-features = false }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
thiserror = "2.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
directories = "6.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
